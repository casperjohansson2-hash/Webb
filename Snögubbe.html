<!DOCTYPE html>
<html lang="sv">

<head>
<meta charset="UTF-8">
<title>Snögubbe</title>
</head>

<body>
    <canvas id="canvas" width="600" height="500" style="border: 3px solid black;"></canvas>
<script>
    var canvas = document.getElementById("canvas");
    var ctx = canvas.getContext("2d");

    ctx.beginPath();
    ctx.arc(300, 380, 100, 0, Math.PI * 2);
    ctx.fillStyle = "lightblue";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(300, 260, 70, 0, Math.PI * 2);
    ctx.fillStyle = "lightblue";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(300, 170, 40, 0, Math.PI * 2);
    ctx.fillStyle = "lightblue";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(285, 160, 8, 0, Math.PI * 2);
    ctx.fillStyle = "black";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(315, 160, 8, 0, Math.PI * 2);
    ctx.fillStyle = "black";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(300, 240, 8, 0, Math.PI * 2);
    ctx.fillStyle = "black";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(300, 270, 8, 0, Math.PI * 2);
    ctx.fillStyle = "black";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(300, 340, 8, 0, Math.PI * 2);
    ctx.fillStyle = "black";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(300, 370, 8, 0, Math.PI * 2);
    ctx.fillStyle = "black";
    ctx.fill();
    ctx.fillStyle = "black";
    ctx.fillRect(250, 130, 100, 10);
    ctx.fillStyle = "black";
    ctx.fillRect(250, 30, 60, 100);
</script>
</body>

</html>
