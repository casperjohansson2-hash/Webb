<!DOCTYPE html>
<html lang="sv">

<head>
<meta charset="UTF-8">
<title>Snögubbe</title>
</head>

<body>
    <canvas id="canvas" width="600" height="500" style="border: 3px solid black;"></canvas>
<script>
    var canvas = document.getElementById("canvas");
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "green";
    ctx.fillRect(0, 440, 600, 60);
    ctx.beginPath();
    ctx.arc(300, 380, 100, 0, Math.PI * 2);
    ctx.fillStyle = "lightblue";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(300, 260, 70, 0, Math.PI * 2);
    ctx.fillStyle = "lightblue";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(300, 170, 40, 0, Math.PI * 2);
    ctx.fillStyle = "lightblue";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(285, 160, 8, 0, Math.PI * 2);
    ctx.fillStyle = "black";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(315, 160, 8, 0, Math.PI * 2);
    ctx.fillStyle = "black";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(300, 240, 8, 0, Math.PI * 2);
    ctx.fillStyle = "black";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(300, 270, 8, 0, Math.PI * 2);
    ctx.fillStyle = "black";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(300, 340, 8, 0, Math.PI * 2);
    ctx.fillStyle = "black";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(300, 370, 8, 0, Math.PI * 2);
    ctx.fillStyle = "black";
    ctx.fill();
    ctx.fillStyle = "black";
    ctx.fillRect(250, 130, 100, 10);
    ctx.fillStyle = "black";
    ctx.fillRect(270, 60, 60, 70);
    ctx.beginPath();
    ctx.moveTo(300, 170); 
    ctx.lineTo(330, 175); 
    ctx.lineTo(300, 180); 
    ctx.closePath();
    ctx.fillStyle = "orange";
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(221, 120);
    ctx.lineTo(260, 150);
    ctx.lineTo(221, 110);
    ctx.fillStyle = "black";
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(130, 90, 120, 50, 0, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
    ctx.strokeStyle = "black";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.font = "24px Comic Sans";
    ctx.fillStyle = "black";
    ctx.fillText("Jag hittar inte hem.", 44, 95);
    
</script>
</body>

</html>
